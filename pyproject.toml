[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonetsim"
version = "1.0.0"
description = "A library for (so)cial (net)work (sim)ulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-2.1" }
authors = [{ name = "Cason Konzer", email = "casonk@umich.edu" }]
keywords = ["social network", "simulation", "community detection", "graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
]
dependencies = [
    "networkx",
    "numpy>=1.20",
    "pandas>=1.3",
    "cdlib>=0.3.0",
    "bayanpy>=0.7.6",
    "leidenalg>=0.10.1",
    "wurlitzer>=3.0.3",
    "infomap>=2.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "dyno_lab @ git+https://github.com/casonk/dyno-lab.git",
]

[project.urls]
Homepage = "https://github.com/casonk/sonetsim"
Repository = "https://github.com/casonk/sonetsim"
Changelog = "https://github.com/casonk/sonetsim/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["sonetsim*"]

[tool.pytest.ini_options]
testpaths = ["sonetsim/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",
    "SIM108",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
